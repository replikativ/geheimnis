version: 2.1

orbs:
  tools: replikativ/clj-tools@0

jobs:
  rng-initialization:
    docker:
      - image: clojure:temurin-21-tools-deps
    steps:
      - checkout
      - run:
          name: Namespace loading must not initialize the CSPRNG
          command: clojure -M:test -m native-image-random

workflows:
  build-test-and-deploy:
    jobs:
      - rng-initialization
      - tools/setup:
          context: dockerhub-deploy
          setup_cljs: true
      - tools/build:
          context: dockerhub-deploy
          build_cljs: true
          requires:
            - tools/setup
      - tools/format:
          context: dockerhub-deploy
          requires:
            - tools/setup
      - tools/unittest:
          context: dockerhub-deploy
          requires:
            - tools/build
      - tools/cljstest:
          context: dockerhub-deploy
          requires:
            - tools/build
      - tools/deploy:
          context:
            - clojars-deploy
            - dockerhub-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/format
            - tools/unittest
            - tools/cljstest
            - rng-initialization
      - tools/release:
          context:
            - github-token
            - dockerhub-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy
